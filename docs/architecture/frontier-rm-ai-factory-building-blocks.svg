  <rect x="1212" y="1278" width="34" height="24" rx="4" fill="#ffffff" stroke="#4d7c0f" stroke-width="3"/><text class="legend" x="1260" y="1296">Governance / human control</text>
  <rect x="1590" y="1278" width="34" height="24" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="3" stroke-dasharray="7 5"/><text class="legend" x="1638" y="1296">Wider capability / target state</text>
