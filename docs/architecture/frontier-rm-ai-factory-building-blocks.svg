<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">Frontier RM AI Factory building blocks</title>
  <desc id="desc">Layered Microsoft data and agentic AI framework distinguishing Frontier RM solution components from wider Azure and Microsoft platform capabilities.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #132433; }
      .title { font-size: 52px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #526474; }
      .section { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
      .layer-title { font-size: 27px; font-weight: 700; }
      .layer-sub { font-size: 17px; fill: #3f5363; }
      .block-title { font-size: 24px; font-weight: 700; }
      .block-sub { font-size: 16px; fill: #3f5363; }
      .side { font-size: 25px; font-weight: 700; }
      .footer-title { font-size: 20px; font-weight: 700; }
      .footer-sub { font-size: 15px; fill: #536575; }
      .legend { font-size: 16px; fill: #34495a; }
    </style>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#8ba4bd" opacity=".45"/>
